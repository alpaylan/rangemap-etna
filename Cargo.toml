[package]
name = "rangemap"
version = "1.7.1"
authors = ["Jeff Parsons <jeff@parsons.io>"]
edition = "2018"
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/jeffparsons/rangemap"
documentation = "https://docs.rs/rangemap"
homepage = "https://github.com/jeffparsons/rangemap"
description = """
Map and set data structures whose keys are stored as ranges.

Contiguous and overlapping ranges that map to the same value are coalesced into a single range.
"""
categories = ["data-structures"]
rust-version = "1.81.0"
exclude = [
    ".github/*",
    "bors.toml",
    "pre_commit.sh",
    "README.fuzz.md",
]

[dependencies]
quickcheck = { version = "1.0.3", optional = true }
serde = { version = "1", optional = true }

# ETNA framework deps — optional, activated by the `etna` feature.
proptest = { version = "1.11.0", optional = true }
quickcheck_etna = { package = "quickcheck", git = "https://github.com/alpaylan/quickcheck.git", branch = "master", features = ["etna"], optional = true }
crabcheck = { git = "https://github.com/alpaylan/crabcheck.git", branch = "main", optional = true }
hegeltest = { version = "0.3.7", optional = true }
rand_etna = { package = "rand", version = "0.9", optional = true }

[dev-dependencies]
permutator = "0.4"
# Criterion bumps its MSRV in 0.3.6; it is probably reasonable
# to update rangemap's MSRV, too, but until I actually publish
# a policy on that I'm going to avoid doing a big bump right now.
# (Later problem!)
criterion = "0.7"
chrono = "0.4"          # For examples
rustc_version = "0.4"
serde_json = "1"
proptest = "1.4"
test-strategy = "0.4"

[features]
serde1 = ["serde"]
# So we can run doc tests from "README.md".
nightly = []
# Enables `RangeMap::new()`, `RangeInclusiveMap::new()`, `RangeSet::new()`,
# and `RangeInclusiveSet::new()` to be const functions.
# Requires a nightly compiler because `const_btree_new` is an unstable feature,
# but is soon to be stabilized: <https://github.com/rust-lang/rust/issues/71835>
const_fn = []
quickcheck = ["dep:quickcheck"]
# ETNA integration: pulls in every PBT framework needed by src/bin/etna.rs
# and activates src/etna.rs (the framework-neutral property module).
etna = [
    "dep:proptest",
    "dep:quickcheck_etna",
    "dep:crabcheck",
    "dep:hegeltest",
    "dep:rand_etna",
]

[[bench]]
name = "benches"
harness = false

[[bin]]
name = "etna"
path = "src/bin/etna.rs"
required-features = ["etna"]

[[bin]]
name = "etna-faultloc"
path = "src/bin/etna-faultloc.rs"
required-features = ["etna"]

[[test]]
name = "etna_witnesses"
path = "tests/etna_witnesses.rs"
required-features = ["etna"]

[profile.release]
# ETNA: keep debug info + debug assertions so internal invariants panic and
# backtraces are usable when the runner catches them.
debug = true
debug-assertions = true
